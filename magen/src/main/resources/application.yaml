spring:
  application:
    name: magen

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/magen_db}
    username: postgres
    password: ${NewTempPass123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

comfyui:
  url: ${COMFYUI_URL:http://127.0.0.1:8188}